# Raft log: command types, payloads, entries, in-memory log, WAL wire format
log:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/log/**'

# Key-value state machine
state:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/state/**'

# Transport interface and RPC message types
transport:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/transport/**'

# RaftNode: election, replication, the tick loop
node:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/node/**'

# Test helpers, including the in-memory transport
testing:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/testing/**'

# Documentation (Markdown files or docs folders)
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'

# The docs site's build: VuePress config, theme and dependencies
docs-site:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/.vuepress/**'
          - 'docs/package.json'
          - 'docs/bun.lock'

# Build system, toolchain, and CI plumbing
build:
  - changed-files:
      - any-glob-to-any-file:
          - 'build.zig'
          - 'build.zig.zon'
          - '.github/**'
          - '.mise.toml'
          - '.pre-commit-config.yaml'
          - '.markdownlint-cli2.yaml'
          - '.yamllint.yaml'
          - '.editorconfig'
          - 'renovate.json'

# Add 'enhancement' to any PR whose head branch starts with `feat` or `feature`
enhancement:
  - head-branch:
      - '^feat'
      - '^feature'

# Add 'bug' to any PR whose head branch starts with `fix` or `bug`
bug:
  - head-branch:
      - '^bug'
      - '^fix'
