name: CI

# Everything a pull request runs on the code. The work lives in zig.yaml, a
# workflow of its own that also runs on every push to main and from the
# Actions tab.
on:
  # Skip pull requests that only touch documentation; the docs workflow covers
  # those, README included. The filter excludes rather than lists, so a new
  # source directory or config file runs CI by default. No check is required
  # by a ruleset, which is what makes a workflow-level filter safe: a skipped
  # required check would block the merge.
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zig:
    name: Zig
    uses: ./.github/workflows/zig.yaml
