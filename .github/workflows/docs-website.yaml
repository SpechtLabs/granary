name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/**/*
      - .github/workflows/docs-website.yaml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - docs/**/*
      - .github/workflows/docs-website.yaml

jobs:
  md:
    name: Markdown
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Installs the linters pinned in mise.toml.
      # mise-action caches the installed tools, keyed on mise.toml.
      - name: Setup toolchain
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Lint Markdown
        run: markdownlint-cli2 "**/*.md"

  build:
    runs-on: ubuntu-latest
    name: Build (Docs)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Installs the toolchain pinned in mise.toml (bun, zig).
      # mise-action caches the installed tools, keyed on mise.toml.
      - name: Setup toolchain
        uses: jdx/mise-action@v2
        with:
          cache: true

      # Caches bun's global module cache so installs reuse downloaded
      # packages; keyed on the lockfile so it busts when deps change.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('docs/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: cd docs && bun install --frozen-lockfile

      - name: Build
        run: cd docs && bun run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: docs
          path: docs/.vuepress/dist

  deploy-gh-pages:
    runs-on: ubuntu-latest
    needs:
      - build
      - md
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    permissions:
      id-token: write
      pages: write

    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download Artifacts for Website
        uses: actions/download-artifact@v7
        with:
          name: docs
          path: ./dist

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-static-pages:
    runs-on: ubuntu-latest
    needs:
      - build
      - md
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    permissions:
      id-token: write
      pages: write

    steps:
      - name: Download Artifacts for Website
        uses: actions/download-artifact@v7
        with:
          name: docs
          path: ./dist

      - name: Upload to Static Pages
        uses: SpechtLabs/StaticPages-Upload@main
        with:
          endpoint: https://granary.specht-labs.de
          site-dir: dist/
