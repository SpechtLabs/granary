name: Zig

# The Zig package: formatting, YAML and workflow lint, build and tests. ci.yaml
# calls it for pull requests; pushes to main run it directly, which is also
# what saves the caches pull requests restore. It runs on its own from the
# Actions tab too.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!LICENSE"

permissions:
  contents: read

env:
  # Each job installs the tools listed below with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first, the docs
  # site's bun and node included.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.3
  # Every tool a job here runs, installed in every job. mise-action keys its
  # cache on install_args, so one list means one cache: main's runs save it
  # and every pull request restores it.
  MISE_TOOLS: zig yamllint actionlint shellcheck

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      - name: Check Zig formatting
        run: mise run fmt-check

      - name: Lint YAML
        run: mise run yaml-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # Zig's global cache (fetched packages, compiled std and compiler_rt)
      # and the project's local build cache. The key is the Zig version and
      # the dependency set: the first run after either changes saves it
      # (main's run, which pull requests then restore), and it isn't
      # rewritten until they change again. Zig's caches are content-addressed,
      # so a restored cache from older sources is still safe to build on.
      - name: Cache Zig build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('.mise.toml', 'build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test
