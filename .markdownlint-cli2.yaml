config:
  # Default state for all rules
  default: true

  # MD013: Disable line length rule
  MD013: false
  MD024: false
  MD038: false
  MD060: false

# Every Markdown file in the repository: the README and the docs site. The docs
# workflow runs this through `mise run docs-lint`.
globs:
  - "**/*.md"

# Ignore node_modules directory and other common patterns
ignores:
  - "**/node_modules/**"
  - ".git/**"
  - "vendor/**"
  - CHANGELOG.md
